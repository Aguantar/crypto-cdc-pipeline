services:
  mysql:
    image: mysql:8.0
    container_name: cdc-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"   # 2026-09-20 docs/34 #1: LAN 노출 차단(호스트 cron·docker exec 만 접근)
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql/my.cnf:/etc/mysql/conf.d/custom.cnf
    deploy:
      resources:
        limits:
          memory: 1280M   # 2026-09-20: 986MiB/1GiB 로 여유 5% (버퍼 풀 512M + 기본 오버헤드) → 1.25G
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-row-image=FULL
      --binlog-expire-logs-seconds=2592000
      --max-binlog-size=100M
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cdc-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: cdc-zookeeper
    restart: unless-stopped
    # 2026-09-20: 2181 퍼블리시 제거. 호스트에서 이 포트를 쓰는 곳이 하나도 없었고(grep·연결 확인),
    # Kafka 는 같은 도커 네트워크에서 zookeeper:2181 로 붙는다. LAN 에 열어 둘 이유가 없었다.
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - cdc-network

  kafka-1:
    image: confluentinc/cp-kafka:7.5.3
    container_name: cdc-kafka-1
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      # 2026-09-20: 0.0.0.0 → 127.0.0.1. EXTERNAL 리스너는 advertised 가 localhost:9092 라
      # 애초에 다른 기기에서 쓸 수 없었다(브로커가 'localhost 로 오라'고 답한다). 쓸모는 없고 공격면만 됐다.
      # 호스트에서 쓰는 곳은 pipeline-load-lab 의 재생 스크립트들(기본값 localhost:9092)뿐이라 그대로 동작한다.
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1   # 2026-09-17 브로커 3→1 (docs/24). 동적 설정으로 이미 minISR=1 적용, 정적값을 일치시킴
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
      KAFKA_LOG_RETENTION_HOURS: 72
      KAFKA_LOG_SEGMENT_BYTES: 104857600
      KAFKA_LOG_RETENTION_BYTES: 1073741824
    deploy:
      resources:
        limits:
          memory: 1280M
    volumes:
      - kafka1_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka-1:29092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cdc-network

  kafka-connect:
    image: debezium/connect:2.5
    container_name: cdc-kafka-connect
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:8083"   # 2026-09-20 docs/34 #1: Connect REST 는 무인증 - 로컬만
    environment:
      GROUP_ID: cdc-connect-cluster
      BOOTSTRAP_SERVERS: kafka-1:29092
      CONFIG_STORAGE_TOPIC: _connect-configs
      OFFSET_STORAGE_TOPIC: _connect-offsets
      STATUS_STORAGE_TOPIC: _connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 3
      STATUS_STORAGE_REPLICATION_FACTOR: 3
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_PRODUCER_ENABLE_IDEMPOTENCE: "true"
      HEAP_OPTS: "-Xmx512m -Xms256m"
    deploy:
      resources:
        limits:
          memory: 1280M
    networks:
      - cdc-network

  flink-jobmanager:
    image: flink:1.18-java11
    container_name: cdc-flink-jobmanager
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      # ClickHouse 싱크 인증 (docs/21). main() 이 제출 시 이 env 를 읽어 잡 그래프에 넣는다
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/cdc_pipeline?user=${CLICKHOUSE_PIPELINE_USER}&password=${CLICKHOUSE_PIPELINE_PASSWORD}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 768m
        state.backend: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
        execution.checkpointing.interval: 60000
        execution.checkpointing.mode: EXACTLY_ONCE
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
        restart-strategy: fixed-delay
        restart-strategy.fixed-delay.attempts: 3
        restart-strategy.fixed-delay.delay: 10s
    user: "0"
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints
      - ./flink/target:/opt/flink/usrlib
    deploy:
      resources:
        limits:
          memory: 896M
    networks:
      - cdc-network

  flink-taskmanager:
    image: flink:1.18-java11
    container_name: cdc-flink-taskmanager
    restart: unless-stopped
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/cdc_pipeline?user=${CLICKHOUSE_PIPELINE_USER}&password=${CLICKHOUSE_PIPELINE_PASSWORD}
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 2g
        taskmanager.memory.jvm-metaspace.size: 384m
        taskmanager.memory.managed.fraction: 0.25
        taskmanager.numberOfTaskSlots: 8   # 2026-09-20 docs/31: 슬롯 = CDC 2 + 호가 1 + 서킷 1 + Binance 체결 2 + Binance 호가 2 (코어 4 지만 IO 대기)
        state.backend: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
    user: "0"
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints
    deploy:
      resources:
        limits:
          memory: 2304M
    networks:
      - cdc-network

  # 2026-09-17 부하 실험 전용 TaskManager (docs/15 §4). 프로필 lab 으로만 기동: docker compose --profile lab up -d flink-taskmanager-lab
  # 왜 별도 TM 인가: 프로덕션 TM 슬롯이 4/4 사용 중이라 실험 잡은 이 TM 에만 배치된다 → 슬롯 경합 없음. 실험이 끝나면 내린다.
  flink-taskmanager-lab:
    image: flink:1.18-java11
    container_name: cdc-flink-taskmanager-lab
    profiles: ["lab"]
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1536m
        taskmanager.memory.jvm-metaspace.size: 256m
        taskmanager.memory.managed.fraction: 0.25
        taskmanager.numberOfTaskSlots: 2
        state.backend: hashmap
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
    user: "0"
    volumes:
      - flink_checkpoints:/opt/flink/checkpoints
      - flink_savepoints:/opt/flink/savepoints
    deploy:
      resources:
        limits:
          memory: 1792M
    networks:
      - cdc-network

  clickhouse:
    image: clickhouse/clickhouse-server:24.1
    container_name: cdc-clickhouse
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"   # 2026-09-20 docs/34 #1: ClickHouse HTTP 는 로컬(cron·Airflow 는 컨테이너망)만
    environment:
      CLICKHOUSE_DB: cdc_pipeline
      CLICKHOUSE_USER: default
      # 2026-09-17 접근 통제 (docs/21): default 에 비밀번호. "localhost 전용" 제한은 Docker userland proxy 가 모든 호스트 포트 접속을
      # 127.0.0.1 로 보이게 해 무의미했다(n8n 접속이 127.0.0.1 로 관측됨). 따라서 인증이 유일한 통제다.
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_DEFAULT_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./clickhouse/config.d/system-logs-ttl.xml:/etc/clickhouse-server/config.d/system-logs-ttl.xml:ro
      - ./clickhouse/config.d/backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro       # 백업 허용 경로 (docs/21)
      - /home/calme/clickhouse-client-config.xml:/etc/clickhouse-client/config.xml:ro              # docker exec clickhouse-client 인증 (docs/21, 저장소 밖)
      - /home/calme/clickhouse-backups:/backups                                                    # 백업 산출물 (호스트 → rsync → Oracle)
    deploy:
      resources:
        limits:
          memory: 1792M
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - cdc-network

  grafana:
    image: grafana/grafana:11.0.0
    container_name: cdc-grafana
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      # 2026-09-20 최종 구조(docs/21 §5-12): 닫는 대신 문을 단다.
      #   문  = Caddy basic_auth (grafana.<내-도메인>, scripts/ops/caddy-grafana-auth.sh)
      #   익명 = 문을 통과한 사람이 두 번 로그인하지 않게. 방문자는 비밀번호를 한 번만 친다
      #   범위 = 데이터소스 계정 grafana_public 이 정한다(cdc_pipeline 읽기만, 쓰기·게임 DB 없음)
      # 이 셋의 역할이 다르다: 문은 '누가', 익명은 '편의', 계정은 '무엇까지'.
      # 순서 주의 - Caddy 문을 먼저 달고 이 값을 켜야 한다. 반대로 하면 그 사이가 완전 공개다.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # 2026-09-20: 데이터소스를 읽기 전용 계정으로 내렸다. 익명 Viewer 가 켜져 있어 이 자격증명은
      # 사실상 '인증 없는 사람의 권한'이다 (grafana/provisioning/datasources/clickhouse.yml 주석 참고)
      CLICKHOUSE_GRAFANA_PUBLIC_USER: ${CLICKHOUSE_GRAFANA_PUBLIC_USER}
      CLICKHOUSE_GRAFANA_PUBLIC_PASSWORD: ${CLICKHOUSE_GRAFANA_PUBLIC_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - cdc-network

  upbit-producer:
    build: ./producer
    container_name: cdc-upbit-producer
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: cdc-mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: producer                       # 2026-09-20 docs/34 #1: root 대신 crypto_trades INSERT/SELECT 만 가진 전용 사용자
      MYSQL_PASSWORD: ${PRODUCER_MYSQL_PASSWORD}
      MYSQL_DATABASE: crypto_db
      BATCH_SIZE: "100"
      MARKETS: ALL_KRW
      CLICKHOUSE_URL: http://cdc-clickhouse:8123          # 수리 계보 기록 (docs/20)
      CLICKHOUSE_PIPELINE_USER: ${CLICKHOUSE_PIPELINE_USER}
      CLICKHOUSE_PIPELINE_PASSWORD: ${CLICKHOUSE_PIPELINE_PASSWORD}
      BATCH_INTERVAL_SEC: "2"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - cdc-network

  orderbook-collector:
    build: ./orderbook-collector
    container_name: cdc-orderbook-collector
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka-1:29092
      ORDERBOOK_TOPIC: upbit.orderbook.v1
      ORDERBOOK_COUNT: "15"
      QUOTE_CURRENCY: KRW
      STATS_INTERVAL_SEC: "30"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - cdc-network

  # 2층 원장 생성기 (docs/28 B, 2026-09-19): Binance Spot Testnet 주문 → 유저 스트림 → MySQL 원장. 키가 있어야 하므로 profile 로 격리.
  #   실행: docker compose --profile ledger up -d --build virtual-trader
  virtual-trader:
    build: ./virtual-trader
    container_name: cdc-virtual-trader
    restart: unless-stopped
    profiles: ["ledger"]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      BINANCE_API_KEY: ${BINANCE_API_KEY}
      BINANCE_ED25519_PRIVATE_KEY_PATH: /run/secrets/binance_ed25519.pem
      MYSQL_HOST: cdc-mysql
      MYSQL_USER: ledger
      MYSQL_PASSWORD: ${LEDGER_MYSQL_PASSWORD}
      MYSQL_DATABASE: crypto_db
      SYMBOLS: BTCUSDT,ETHUSDT,BNBUSDT,SOLUSDT,XRPUSDT
      # 2026-09-20 (docs/28 B 주기·상한 개정): 300초·60건이면 하루치를 100분에 소진하고 22시간을 쉬었다.
      # 이 원장은 합성 거래 카나리아라 CDC 경로가 24시간 신호를 내야 한다 → 15분 주기로 하루에 고르게.
      # 288 = 3건 × (86400/900), 매시 4 사이클이라 빈 시간이 없다. 주문 1,440건/일 = 거래소 일 한도의 0.9%.
      CYCLE_SEC: "900"
      CANCEL_AFTER_SEC: "90"
      ORDER_NOTIONAL_USDT: "20"
      MAX_ORDERS_PER_SYMBOL_PER_DAY: "288"
    volumes:
      - ./secrets/binance_testnet_ed25519.pem:/run/secrets/binance_ed25519.pem:ro
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - cdc-network

  # Binance 체결 수집기 (docs/31 §3-2, 2026-09-20): USDT 전 심볼 trade 스트림 → Kafka 직행. 실측 24h 평균 361 msg/s.
  binance-collector:
    build: ./binance-collector
    container_name: cdc-binance-collector
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka-1:29092
      BINANCE_TRADES_TOPIC: binance.trades.v1
      QUOTE_ASSET: USDT
      STREAMS_PER_CONN: "400"
      STATS_INTERVAL_SEC: "30"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - cdc-network

  # Binance 호가 수집기 (docs/31 §3-3): 같은 이미지, depth 모드 - 상위 N 심볼 diff depth@100ms + 5분 REST 스냅샷. 작게 시작(10) → 1단계 24h 뒤 50.
  binance-depth-collector:
    build: ./binance-collector
    container_name: cdc-binance-depth-collector
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
    environment:
      MODE: depth
      DEPTH_TOP_N: "10"
      DEPTH_SNAPSHOT_SEC: "300"
      KAFKA_BOOTSTRAP: kafka-1:29092
      BINANCE_TRADES_TOPIC: binance.depth.v1
      STATS_INTERVAL_SEC: "30"
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - cdc-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cdc-kafka-ui
    profiles: ["ops"]   # 2026-09-20: 상시 운영에서 제외(kafka-ui 장식·Prometheus/statsd 는 Airflow 대시보드 1개용 360MB). 필요 시 --profile ops
    restart: unless-stopped
    depends_on:
      kafka-1:
        condition: service_healthy
    ports:
      - "8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cdc-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      JAVA_OPTS: "-Xmx256m"
    deploy:
      resources:
        limits:
          memory: 384M
    networks:
      - cdc-network

  # ============================================================
  # Airflow (운영 자동화) - 기존 파이프라인 변경 없이 추가
  # ============================================================
  airflow-postgres:
    image: postgres:15-alpine
    container_name: cdc-airflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - cdc-network

  airflow-init:
    build: ./airflow
    image: cdc-airflow:2.8.1
    container_name: cdc-airflow-init
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      CLICKHOUSE_PIPELINE_USER: ${CLICKHOUSE_PIPELINE_USER}          # dbt profile env_var (docs/21)
      CLICKHOUSE_PIPELINE_PASSWORD: ${CLICKHOUSE_PIPELINE_PASSWORD}
      CLICKHOUSE_ICEPUSH_USER: ${CLICKHOUSE_ICEPUSH_USER}            # icepush dbt DAG 용 (타 프로젝트, docs/21)
      CLICKHOUSE_ICEPUSH_PASSWORD: ${CLICKHOUSE_ICEPUSH_PASSWORD}
      LEDGER_MYSQL_PASSWORD: ${LEDGER_MYSQL_PASSWORD}                # cases_hourly DAG 가 MySQL cases 테이블에 쓴다 (docs/28 C)
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password ${AIRFLOW_ADMIN_PASSWORD} --firstname Admin --lastname User --role Admin --email admin@localhost || true
    networks:
      - cdc-network

  airflow-webserver:
    image: cdc-airflow:2.8.1
    container_name: cdc-airflow-webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    ports:
      - "8085:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      CLICKHOUSE_PIPELINE_USER: ${CLICKHOUSE_PIPELINE_USER}          # dbt profile env_var (docs/21)
      CLICKHOUSE_PIPELINE_PASSWORD: ${CLICKHOUSE_PIPELINE_PASSWORD}
      CLICKHOUSE_ICEPUSH_USER: ${CLICKHOUSE_ICEPUSH_USER}            # icepush dbt DAG 용 (타 프로젝트, docs/21)
      CLICKHOUSE_ICEPUSH_PASSWORD: ${CLICKHOUSE_ICEPUSH_PASSWORD}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'false'
      AIRFLOW__WEBSERVER__AUTH_ROLE_PUBLIC: Viewer
      AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Seoul
      AIRFLOW__METRICS__STATSD_ON: 'false'   # 2026-09-20: statsd-exporter 를 ops 프로필로 뺌
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: '9125'
      AIRFLOW__METRICS__STATSD_PREFIX: airflow
    command: webserver
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/webserver_config.py:/opt/airflow/webserver_config.py
      # IcePush (외부 프로젝트 마운트 - DAE 트랙)
      # 2026-09-20: 타 프로젝트(icepush) DAG 마운트 제거 - 이 Airflow 를 이 파이프라인 전용으로.
      # 해당 DAG 은 이미 일시정지 상태였고(마지막 예약 실행 09-05 실패, 09-06 수동 성공이 마지막)
      # 제거해도 기능 변화가 없다. 실행 이력 121건은 메타DB 에 그대로 남는다.
      # 되살리려면 아래 두 줄을 복구하고 compose 재생성:
      #   - /home/calme/icepush/airflow/dags:/opt/airflow/dags/icepush
      #   - /home/calme/icepush:/opt/airflow/icepush
    deploy:
      resources:
        limits:
          memory: 640M
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - cdc-network

  airflow-scheduler:
    image: cdc-airflow:2.8.1
    container_name: cdc-airflow-scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "8"                 # 2026-09-20: 코어 4·메모리 1G 에서 태스크 프로세스 동시 8개 상한 (기본 32)
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "8"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      CLICKHOUSE_PIPELINE_USER: ${CLICKHOUSE_PIPELINE_USER}          # dbt profile env_var (docs/21)
      CLICKHOUSE_PIPELINE_PASSWORD: ${CLICKHOUSE_PIPELINE_PASSWORD}
      LEDGER_MYSQL_PASSWORD: ${LEDGER_MYSQL_PASSWORD}   # 2026-09-24: cases_hourly 가 여기서 돈다(LocalExecutor). airflow-init 에만 있어 09-22 부터 KeyError
      CLICKHOUSE_ICEPUSH_USER: ${CLICKHOUSE_ICEPUSH_USER}            # icepush dbt DAG 용 (타 프로젝트, docs/21)
      CLICKHOUSE_ICEPUSH_PASSWORD: ${CLICKHOUSE_ICEPUSH_PASSWORD}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__METRICS__STATSD_ON: 'false'   # 2026-09-20: statsd-exporter 를 ops 프로필로 뺌
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: '9125'
      AIRFLOW__METRICS__STATSD_PREFIX: airflow
    command: scheduler
    group_add:
      - "101"      # ClickHouse(uid/gid 101) 가 만든 750 백업 디렉터리를 읽기 위해 (docs/21 §4)
    volumes:
      - /home/calme/clickhouse-backups:/backups                     # 백업 스테이징 (ClickHouse 컨테이너와 공유, docs/21 §4)
      - /home/calme/airflow-secrets:/opt/airflow/secrets:ro          # Oracle rsync 용 ssh 키 사본(uid 50000)·고정 호스트키
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./dbt_cdc_pipeline:/opt/airflow/dbt
      - ./airflow/dbt_profiles:/opt/airflow/dbt_profiles
      # IcePush (외부 프로젝트 마운트 - DAE 트랙)
      # 2026-09-20: 타 프로젝트(icepush) DAG 마운트 제거 - 이 Airflow 를 이 파이프라인 전용으로.
      # 해당 DAG 은 이미 일시정지 상태였고(마지막 예약 실행 09-05 실패, 09-06 수동 성공이 마지막)
      # 제거해도 기능 변화가 없다. 실행 이력 121건은 메타DB 에 그대로 남는다.
      # 되살리려면 아래 두 줄을 복구하고 compose 재생성:
      #   - /home/calme/icepush/airflow/dags:/opt/airflow/dags/icepush
      #   - /home/calme/icepush:/opt/airflow/icepush
    deploy:
      resources:
        limits:
          memory: 1024M   # 2026-09-20 01:45: 640M 에서 5분마다 cgroup OOM(스케줄러 재시작 12회/40분, health_check 13태스크 병렬 + DAG 7개 파싱) → 1G + 병렬도 상한
    networks:
      - cdc-network

  # ============================================================
  # Monitoring (Airflow 메트릭 → Grafana)
  # ============================================================
  statsd-exporter:
    image: prom/statsd-exporter:v0.26.0
    container_name: cdc-statsd-exporter
    profiles: ["ops"]   # 2026-09-20: 상시 운영에서 제외(kafka-ui 장식·Prometheus/statsd 는 Airflow 대시보드 1개용 360MB). 필요 시 --profile ops
    restart: unless-stopped
    command:
      - --statsd.mapping-config=/tmp/statsd_mapping.yml
      - --statsd.listen-udp=:9125
      - --web.listen-address=:9102
    volumes:
      - ./monitoring/statsd_mapping.yml:/tmp/statsd_mapping.yml:ro
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - cdc-network

  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: cdc-prometheus
    profiles: ["ops"]   # 2026-09-20: 상시 운영에서 제외(kafka-ui 장식·Prometheus/statsd 는 Airflow 대시보드 1개용 360MB). 필요 시 --profile ops
    restart: unless-stopped
    depends_on:
      - statsd-exporter
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=1GB
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - cdc-network

networks:
  cdc-network:
    driver: bridge

volumes:
  mysql_data:
  zookeeper_data:
  zookeeper_log:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  flink_checkpoints:
  flink_savepoints:
  clickhouse_data:
  grafana_data:
  airflow_postgres_data:
  prometheus_data:
