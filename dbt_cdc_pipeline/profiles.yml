cdc_pipeline:
  target: dev
  outputs:
    dev:
      type: clickhouse
      schema: cdc_pipeline
      host: localhost          # Docker 내부에서 실행 시 cdc-clickhouse
      port: 8123
      user: "{{ env_var('CLICKHOUSE_PIPELINE_USER', 'default') }}"
      password: "{{ env_var('CLICKHOUSE_PIPELINE_PASSWORD', '') }}"
      secure: false
      verify: false
      connect_timeout: 10
      send_receive_timeout: 300
      sync_request_timeout: 5
      # dbt-clickhouse 엔진 설정
      # 테이블 생성 시 MergeTree 기본 사용
