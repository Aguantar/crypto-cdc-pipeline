# CI (2026-09-16 추가, docs/20): 로컬에서 손으로 돌리던 검증을 푸시마다 강제한다.
# 왜: "실행되지 않는 테스트는 게이트가 아니다". 오늘 DAG 구조 테스트 2개가 실제 DAG 와 어긋난 채 몇 주간 실패 상태였고,
#     Flink 빌드는 -DskipTests 로 테스트를 건너뛰고 있었다. 둘 다 CI 가 있었으면 즉시 드러났다.
# 범위: (1) Flink 단위 테스트(늦은 이벤트 가드) (2) Airflow DAG 구조 테스트 (3) dbt parse (모델·소스·테스트 정의 무결성).
#       데이터가 필요한 dbt build/실행 검증은 운영에서(reconcile_trades DAG) 한다 - CI 는 정의만 검사.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  flink-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '11', cache: maven }
      - name: mvn test (AnomalyDetector late-event guard)
        working-directory: flink
        run: mvn -B -q test

  airflow-dag-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: install airflow 2.8.1 (constraints) + pytest
        run: |
          pip install "apache-airflow==2.8.1" --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.8.1/constraints-3.10.txt"
          pip install pytest requests
      - name: DAG structure tests
        # DagBag 로딩은 메타 DB 스키마를 요구하므로 파일 sqlite 를 마이그레이션한 뒤 실행 (컨테이너에선 실 DB 가 있어 드러나지 않던 전제)
        env:
          AIRFLOW_HOME: ${{ github.workspace }}/airflow
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:///${{ runner.temp }}/airflow-ci.db
          AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
        run: |
          airflow db migrate -q 2>/dev/null || airflow db migrate
          python -m pytest airflow/tests/test_dags.py -q

  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: install dbt-clickhouse 1.10.0
        # 2026-10-01: 운영 컨테이너와 같은 버전(dbt-core 1.11.6 / dbt-clickhouse 1.10.0, docs/45). CI 만 1.7 에 남아
        # 09-25 부터 엿새 동안 parse 가 빨갛게 있었다(1.10+ 의 arguments: 문법을 옛 파서가 못 읽음) - "도구는 같은 버전" 이 CI 에도 적용된다.
        run: pip install "dbt-core==1.11.6" "dbt-clickhouse==1.10.0"
      - name: dbt parse (no warehouse connection needed)
        working-directory: dbt_cdc_pipeline
        run: dbt parse --profiles-dir . --target dev
