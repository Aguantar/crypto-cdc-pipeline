cdc_pipeline:
  target: dev
  outputs:
    dev:
      type: clickhouse
      schema: cdc_pipeline
      host: cdc-clickhouse
      port: 8123
      user: "{{ env_var('CLICKHOUSE_PIPELINE_USER', 'default') }}"
      password: "{{ env_var('CLICKHOUSE_PIPELINE_PASSWORD', '') }}"
      secure: false
      verify: false
      connect_timeout: 10
      send_receive_timeout: 300
      sync_request_timeout: 5
